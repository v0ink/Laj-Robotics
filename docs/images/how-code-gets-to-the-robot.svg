<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>How FTC robot code gets to the robot</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="630" fill="#ffffff"/>
<g font-size="14" text-anchor="middle" fill="#2C2C2A">
<rect x="40" y="40" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="130" y="63" font-weight="600">GitHub repo</text><text x="130" y="83" font-size="12" fill="#5F5E5A">Laj-Robotics</text>
<line x1="222" y1="68" x2="276" y2="68" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="280" y="40" width="360" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="460" y="63" font-weight="600">Mac or Windows PC</text><text x="460" y="83" font-size="12" fill="#5F5E5A">Claude Code writes the OpModes</text>
<path d="M320 96 L320 122 L180 122 L180 146" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="96" x2="500" y2="146" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="150" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="180" y="173" font-weight="600">Option A: Gradle build</text><text x="180" y="193" font-size="12" fill="#5F5E5A">Builds the whole app (APK)</text>
<rect x="360" y="150" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="500" y="173" font-weight="600">Option B: OnBot Java</text><text x="500" y="193" font-size="12" fill="#5F5E5A">Upload .java in the browser</text>
<line x1="180" y1="206" x2="180" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="190" y="236" font-size="12" text-anchor="start" fill="#5F5E5A">USB-C cable</text>
<line x1="500" y1="206" x2="500" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="510" y="236" font-size="12" text-anchor="start" fill="#5F5E5A">Hub's own Wi-Fi</text>
<rect x="40" y="262" width="600" height="150" rx="20" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="64" y="290" text-anchor="start" font-weight="600" fill="#085041">REV Control Hub (on robot, "Controller")</text>
<text x="64" y="308" text-anchor="start" font-size="12" fill="#0F6E56">Android computer, no screen</text>
<rect x="64" y="324" width="300" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="214" y="351" font-weight="600" fill="#3C3489">Robot Controller app</text><text x="214" y="371" font-size="12" fill="#534AB7">Our OpModes run here</text>
<line x1="366" y1="356" x2="404" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="408" y="324" width="208" height="64" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="512" y="351" font-weight="600">Motor + servo ports</text><text x="512" y="371" font-size="12" fill="#5F5E5A">4 motors, 2 servos</text>
<line x1="512" y1="412" x2="512" y2="446" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="384" y="450" width="256" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="512" y="473" font-weight="600">Motors and servos</text><text x="512" y="493" font-size="12" fill="#5F5E5A">Drive, intake, flywheel, feeder</text>
<line x1="180" y1="448" x2="180" y2="414" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<text x="190" y="434" font-size="12" text-anchor="start" fill="#5F5E5A">Wi-Fi: sticks, INIT/start/stop</text>
<rect x="40" y="450" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="180" y="473" font-weight="600" fill="#085041">REV Driver Hub (handheld)</text><text x="180" y="493" font-size="12" fill="#0F6E56">Driver Station app, no code</text>
<line x1="180" y1="548" x2="180" y2="510" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="552" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text x="180" y="579" font-weight="600">REV USB gamepad</text>
</g>
</svg>
